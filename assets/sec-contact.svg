<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="52" viewBox="0 0 1000 52" role="img" aria-label="say hello">
  <defs>
    <linearGradient id="s05_r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD166" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#FFD166" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="52" fill="#070A0E" rx="8"/>
  <rect x="0" y="10" width="4" height="32" rx="2" fill="#FFD166"/>
  <text x="20" y="32" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#FFD166"
